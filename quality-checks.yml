name: Application quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PWA and application logic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required application files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js style.css lessons.json manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png test-app.cjs; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Run application regression tests
        run: node test-app.cjs

      - name: Validate roadmap JSON and manifest JSON
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('lessons.json','utf8')); JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); console.log('PASS: lessons.json and manifest.webmanifest are valid JSON');"

      - name: Verify roadmap structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lessons = JSON.parse(fs.readFileSync('lessons.json', 'utf8'));
          if (!Array.isArray(lessons) || lessons.length !== 100) throw new Error('Expected exactly 100 lessons');
          const days = new Set(lessons.map(x => x.day));
          if (days.size !== 100 || !Array.from({length: 100}, (_, i) => days.has(i + 1)).every(Boolean)) throw new Error('Lesson day numbers must be unique and cover 1–100');
          const phases = new Set(lessons.map(x => x.phase));
          if (phases.size !== 7) throw new Error(`Expected 7 phases; found ${phases.size}`);
          console.log('PASS: 100 unique lessons across 7 phases');
          NODE
